const specs = [['nutricion', 'Nutrición'], ['psicologia', 'Psicología']].map(x => ({ label: x[1], pressed: s.spec === x[0] ? 'true' : 'false', style: s.spec === x[0] ? segOn : segOff, pick: () => this.setState({ spec: x[0], service: 0 }) }));
const chipBase = 'font-family:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer;white-space:nowrap;color:#1F3A2B;';
const services = serviceMap[s.spec].map((label, i) => ({ label, pressed: s.service === i ? 'true' : 'false', style: chipBase + (s.service === i ? 'background:#FFFFFF;border:2px solid #1F3A2B' : 'background:#EEF2EA;border:2px solid transparent'), pick: () => this.setState({ service: i }) }));

return {

question: asking ? questions[s.step].q : '',
opts,
progressText: 'Pregunta ' + Math.min(s.step + 1, questions.length) + ' de ' + questions.length,
progressStyle: 'height:5px;border-radius:3px;background:#EE9F5E;width:' + pct + '%;transition:width .4s',
colonies: pool.slice(0, count), recommendation, recK, recL, recWho,
restart: () => this.setState({ step: 0, answers: [], firstPick: null }),
symptoms, specs, services,
pickNutri: () => this.setState({ spec: 'nutricion', service: 0 }),
pickPsico: () => this.setState({ spec: 'psicologia', service: 0 }),
embedTitle: isN ? 'Agenda de Karen' : 'Agenda de Liliana',
embedSub: serviceMap[s.spec][Math.min(s.service, serviceMap[s.spec].length - 1)],
embedAvatar: 'width:40px;height:40px;border-radius:50%;flex-shrink:0;background:#E9E4DC url(' + (isN ? '/assets/mini-karen.jpg' : '/assets/mini-liliana.jpg') + ') center / cover no-repeat'
};
}
